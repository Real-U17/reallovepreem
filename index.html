<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="byAwgB--YyEllRLN1j1JmhSalL_NTD4upUW9TF0EpJk" />
  <meta charset="UTF-8" />
  <title>reallovepreem - Songkran Splash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Kanit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100vh;
      overflow: hidden;
      font-family: 'Kanit', system-ui, sans-serif;
      background-color: #87ceeb;
    }

    .scene {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #aee2ff 0%, #6bb9f0 50%, #f4d03f 50%, #f9e79f 100%);
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      top: 45%;
      left: 0;
      width: 200%;
      height: 10%;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 100%;
      animation: wave-move 4s infinite alternate ease-in-out;
    }

    .wave:nth-child(2) {
      top: 47%;
      background: rgba(255, 255, 255, 0.2);
      animation-delay: -2s;
    }

    @keyframes wave-move {
      0% { transform: translateX(0) scaleY(1); }
      100% { transform: translateX(-10%) scaleY(1.2); }
    }

    .songkran-title {
      position: absolute;
      top: 10%;
      width: 100%;
      text-align: center;
      font-size: 3rem;
      color: #fff;
      text-shadow: 3px 3px 0 #ff6b81, -2px -2px 0 #4facfe;
      z-index: 3;
      animation: bounce-text 2s infinite ease-in-out;
      letter-spacing: 2px;
    }

    @keyframes bounce-text {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }

    .characters {
      position: absolute;
      bottom: 8%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 150px;
      z-index: 5;
    }

    .character-wrapper {
      position: relative;
      width: 300px;
      height: 350px;
      animation: float 3s infinite ease-in-out;
    }

    .char-right { animation-delay: -1.5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .water-stream {
      position: absolute;
      height: 15px;
      border-radius: 10px;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.8);
      opacity: 0.8;
      z-index: 4;
      pointer-events: none;
    }

    .stream-left {
      top: 180px;
      left: 220px;
      width: 0;
      animation: shoot-left 2s infinite ease-out;
      transform-origin: left center;
    }

    @keyframes shoot-left {
      0% { width: 0; opacity: 1; transform: translateX(0); }
      40% { width: 350px; opacity: 0.8; transform: translateX(0) rotate(-5deg); }
      80% { width: 100px; opacity: 0; transform: translateX(250px) rotate(-5deg); }
      100% { width: 0; opacity: 0; }
    }

    .stream-right {
      top: 200px;
      right: 220px;
      width: 0;
      background: linear-gradient(-90deg, #43e97b 0%, #38f9d7 100%);
      box-shadow: 0 0 10px rgba(56, 249, 215, 0.8);
      animation: shoot-right 2s infinite ease-out;
      animation-delay: -1s;
      transform-origin: right center;
    }

    @keyframes shoot-right {
      0% { width: 0; opacity: 1; transform: translateX(0); }
      40% { width: 350px; opacity: 0.8; transform: translateX(0) rotate(5deg); }
      80% { width: 100px; opacity: 0; transform: translateX(-250px) rotate(5deg); }
      100% { width: 0; opacity: 0; }
    }

    .particle {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
    }

    #ui {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10;
        pointer-events: none; 
    }

    .game-menu-container {
        position: fixed;
        right: 20px;
        bottom: 550px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 1000;
        width: 170px;
    }

    .menu-label {
        color: #ffb6c1;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: -2px;
        text-align: right;
        opacity: 0.9;
        text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
    }

    .game-btn {
        position: relative;
        padding: 12px 15px;
        background: rgba(255, 20, 147, 0.15);
        border: 1px solid rgba(255, 105, 180, 0.5);
        backdrop-filter: blur(5px);
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .game-btn span {
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        z-index: 2;
        text-shadow: 0 0 2px rgba(255, 20, 147, 0.5);
    }

    .game-btn:hover {
        background: rgba(255, 20, 147, 0.3);
        border-color: rgba(255, 105, 180, 1);
        box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        transform: translateX(-5px);
    }

    .game-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 0%; height: 100%;
        background: linear-gradient(90deg, rgba(255, 20, 147, 0.4), transparent);
        transition: width 0.3s;
        z-index: 1;
    }

    .game-btn:hover::before {
        width: 100%;
    }

    .menu-icon-block {
        width: 14px;
        height: 14px;
        background: linear-gradient(135deg, #ff69b4, #bd00ff);
        border-radius: 3px;
        box-shadow: 0 0 8px rgba(255, 105, 180, 0.8);
        z-index: 2;
        position: relative;
        border: 1px solid rgba(255,255,255,0.3);
    }

    #ui .love {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -225px 0 0 -225px;
      --i: 1;
      pointer-events: none;
    }
    #ui .love:last-child .love_word {
      color: #fff;
      font-size: 2rem;
      text-shadow: 0 0 10px #ea80b0;
    }
    #ui .love:last-child .love_word {
        color: #ea80b0;
        font-size: 1.4rem;
        text-shadow: 0 0 10px #fff;
    }

    #ui .love_word {
      color: #ea80b0;
      font-size: 1.4rem;
      transform: translateY(-100%) rotateZ(-30deg);
      text-shadow: 0 0 10px #fff;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    #ui .love_horizontal {
      animation: horizontal 10000ms infinite alternate ease-in-out;
      animation-delay: calc(var(--i) * -300ms);
    }
    #ui .love_vertical {
      animation: vertical 20000ms infinite linear;
      animation-delay: calc(var(--i) * -300ms);
    }

    @keyframes horizontal {
      from { transform: translateX(0px); }
      to   { transform: translateX(450px); }
    }
    @keyframes vertical {
      0%   { transform: translateY(180px); }
      10%  { transform: translateY(45px); }
      15%  { transform: translateY(4.5px); }
      18%  { transform: translateY(0px); }
      20%  { transform: translateY(4.5px); }
      22%  { transform: translateY(34.61538px); }
      24%  { transform: translateY(64.28571px); }
      25%  { transform: translateY(112.5px); }
      26%  { transform: translateY(64.28571px); }
      28%  { transform: translateY(34.61538px); }
      30%  { transform: translateY(4.5px); }
      32%  { transform: translateY(0px); }
      35%  { transform: translateY(4.5px); }
      40%  { transform: translateY(45px); }
      50%  { transform: translateY(180px); }
      71%  { transform: translateY(428.57143px); }
      72.5%{ transform: translateY(441.17647px); }
      75%  { transform: translateY(450px); }
      77.5%{ transform: translateY(441.17647px); }
      79%  { transform: translateY(428.57143px); }
      100% { transform: translateY(180px); }
    }

    @media screen and (max-width: 768px) {
        .characters {
            gap: 20px;
            transform: scale(0.7);
            bottom: 5%;
        }
        .songkran-title {
            font-size: 2rem;
        }
        .stream-left { animation: shoot-left-mobile 2s infinite ease-out; }
        .stream-right { animation: shoot-right-mobile 2s infinite ease-out; }

        @keyframes shoot-left-mobile {
            0% { width: 0; opacity: 1; }
            40% { width: 150px; opacity: 0.8; }
            80% { width: 50px; opacity: 0; transform: translateX(100px); }
            100% { width: 0; opacity: 0; }
        }
        @keyframes shoot-right-mobile {
            0% { width: 0; opacity: 1; }
            40% { width: 150px; opacity: 0.8; }
            80% { width: 50px; opacity: 0; transform: translateX(-100px); }
            100% { width: 0; opacity: 0; }
        }

        .game-menu-container {
            bottom: 120px; 
            right: 20px;   
            width: 150px; 
            transform: none; 
            align-items: flex-end; 
        }
        
        .menu-label {
            display: block; 
            font-size: 9px;
        }
    }
  </style>
</head>

  <script>
    const N = 100; 
    const ui = document.getElementById('ui');

    for (let i = 1; i <= N; i++) {
      const love = document.createElement('div');
      love.className = 'love';
      love.style.setProperty('--i', i);

      const h = document.createElement('div');
      h.className = 'love_horizontal';

      const v = document.createElement('div');
      v.className = 'love_vertical';

      const word = document.createElement('div');
      word.className = 'love_word';
      word.textContent = 'Real love Preem';

      v.appendChild(word);
      h.appendChild(v);
      love.appendChild(h);
      ui.appendChild(love);
    }

    function createSplash(scene, x, y, direction) {
      const particle = document.createElement('div');
      particle.classList.add('particle');

      const size = Math.random() * 8 + 4;
      particle.style.width = `${size}px`;
      particle.style.height = `${size}px`;

      const colors = ['#00f2fe', '#4facfe', '#ffffff', '#38f9d7'];
      particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      scene.appendChild(particle);

      const angle = (Math.random() * 45 - 22.5) * (Math.PI / 180);
      const velocity = Math.random() * 50 + 50;
      const dirMultiplier = direction === 'right' ? 1 : -1;
      const endX = x + (Math.cos(angle) * velocity * 3 * dirMultiplier);
      const endY = y + (Math.sin(angle) * velocity * 3) + 100;

      particle.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 0.8 },
        { transform: `translate(${endX - x}px, ${endY - y}px) scale(0)`, opacity: 0 }
      ], {
        duration: Math.random() * 500 + 500,
        easing: 'cubic-bezier(.25,.8,.25,1)'
      }).onfinish = () => particle.remove();
    }

    const scene = document.getElementById('scene');

    setInterval(() => {
      const isMobile = window.innerWidth <= 768;
      const centerX = window.innerWidth / 2;
      const leftGunX = isMobile ? centerX - 60 : centerX - 120;
      const leftGunY = window.innerHeight * 0.7;
      const rightGunX = isMobile ? centerX + 60 : centerX + 120;
      const rightGunY = window.innerHeight * 0.72;

      for (let i = 0; i < 3; i++) {
        setTimeout(() => createSplash(scene, leftGunX, leftGunY, 'right'), Math.random() * 200);
        setTimeout(() => createSplash(scene, rightGunX, rightGunY, 'left'), Math.random() * 200 + 1000);
      }
    }, 300);
  </script>
