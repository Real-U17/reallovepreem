<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="byAwgB--YyEllRLN1j1JmhSalL_NTD4upUW9TF0EpJk" />
  <meta charset="UTF-8" />
  <title>reallovepreem - Songkran Splash</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Kanit:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body, html {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Kanit', system-ui, sans-serif;
      background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 35%, #67e8f9 70%, #bae6fd 100%);
    }

    .landscape {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
    }

    /* Sun */
    .sun {
        position: absolute;
        top: 45px;
        right: 10%;
        width: 92px;
        height: 92px;
        background: #fde68a;
        border-radius: 50%;
        box-shadow: 0 0 40px #fde68a, 0 0 90px rgba(255, 255, 255, 0.45);
        z-index: 0;
    }

    .hill-bg {
        position: absolute;
        bottom: 0;
        left: -10%;
        width: 120%;
        height: 30%;
        background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
        border-radius: 50% 50% 0 0 / 30% 100% 0 0;
        opacity: 0.8;
        z-index: 1;
    }

    .hill-fg {
        position: absolute;
        bottom: -35px;
        right: -10%;
        width: 120%;
        height: 23%;
        background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 100%);
        border-radius: 50% 50% 0 0 / 20% 100% 0 0;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.2);
        z-index: 3;
    }

    /* Objects Container */
    .scene-objects {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100%;
        z-index: 6; /* Keep Songkran props above foreground hill */
    }

    /* Festival flag */
    .flag {
        position: absolute;
        width: 6px;
        height: 90px;
        background: #f8fafc;
        border-radius: 99px;
        filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.25));
    }
    .flag::after {
        content: '';
        position: absolute;
        top: 8px;
        left: 6px;
        width: 28px;
        height: 18px;
        background: linear-gradient(90deg, #f97316, #f43f5e);
        clip-path: polygon(0 0, 100% 18%, 0 100%);
        border-radius: 0 4px 4px 0;
    }

    .songkran-kids {
        position: absolute;
        left: 50%;
        bottom: 10%;
        width: 520px;
        height: 180px;
        transform: translateX(-50%);
        z-index: 8;
    }
    .kid {
        position: absolute;
        width: 130px;
        height: 170px;
        bottom: 0;
        animation: kidBounce 1.8s ease-in-out infinite;
    }
    .kid.girl { left: 20px; }
    .kid.boy { right: 20px; animation-delay: -0.9s; }

    .kid .head {
        position: absolute;
        width: 46px;
        height: 46px;
        background: #fde68a;
        border-radius: 50%;
        top: 10px;
        left: 42px;
        z-index: 3;
    }
    .kid.girl .head::before,
    .kid.boy .head::before {
        content: '';
        position: absolute;
        width: 48px;
        height: 24px;
        background: #111827;
        top: -4px;
        left: -1px;
        border-radius: 24px 24px 12px 12px;
    }
    .kid.girl .head::after {
        content: '';
        position: absolute;
        width: 13px;
        height: 13px;
        background: #ef4444;
        border-radius: 50%;
        left: -6px;
        top: 8px;
        box-shadow: 12px 2px 0 #f59e0b;
    }

    .kid .body {
        position: absolute;
        width: 62px;
        height: 54px;
        border-radius: 14px;
        top: 54px;
        left: 34px;
    }
    .kid.girl .body { background: #facc15; }
    .kid.boy .body { background: #f43f5e; }

    .kid .arm {
        position: absolute;
        width: 38px;
        height: 14px;
        background: #fde68a;
        border-radius: 10px;
        top: 72px;
        z-index: 2;
    }
    .kid.girl .arm { left: 80px; transform: rotate(-8deg); }
    .kid.boy .arm { right: 80px; transform: rotate(8deg); }

    .kid .leg {
        position: absolute;
        width: 18px;
        height: 40px;
        background: #312e81;
        top: 104px;
        border-radius: 9px;
    }
    .kid.boy .leg { background: #3f3f46; }
    .kid .leg.left { left: 42px; }
    .kid .leg.right { left: 68px; }

    .kid .gun {
        position: absolute;
        width: 52px;
        height: 20px;
        border-radius: 12px;
        top: 70px;
        z-index: 4;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .kid.girl .gun {
        left: 88px;
        background: linear-gradient(90deg, #ec4899, #f59e0b);
    }
    .kid.boy .gun {
        right: 88px;
        background: linear-gradient(90deg, #4338ca, #facc15);
    }
    .kid .gun::before {
        content: '';
        position: absolute;
        width: 10px;
        height: 18px;
        background: #2563eb;
        border-radius: 0 0 8px 8px;
        top: 16px;
        left: 18px;
    }
    .kid.girl .gun::after,
    .kid.boy .gun::after {
        content: '';
        position: absolute;
        width: 12px;
        height: 8px;
        background: #60a5fa;
        border-radius: 99px;
        top: 6px;
    }
    .kid.girl .gun::after { right: -8px; }
    .kid.boy .gun::after { left: -8px; }

    .splash {
        position: absolute;
        top: 78px;
        left: 50%;
        width: 220px;
        height: 22px;
        transform: translateX(-50%);
        pointer-events: none;
    }
    .splash::before,
    .splash::after {
        content: '';
        position: absolute;
        top: 0;
        width: 46%;
        height: 100%;
        border-top: 4px solid rgba(125, 211, 252, 0.95);
        border-radius: 50%;
        filter: drop-shadow(0 0 6px rgba(186, 230, 253, 0.8));
        animation: waterSpray 900ms infinite ease-in-out alternate;
    }
    .splash::before {
        left: 0;
        transform: rotate(6deg);
    }
    .splash::after {
        right: 0;
        transform: rotate(-6deg) scaleX(-1);
        animation-delay: -450ms;
    }

    @keyframes waterSpray {
        from {
            opacity: 0.55;
            border-top-width: 3px;
            transform: translateY(2px) scaleX(0.96);
        }
        to {
            opacity: 1;
            border-top-width: 5px;
            transform: translateY(-2px) scaleX(1.04);
        }
    }
    @keyframes kidBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    #water-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
    }

    #ui {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10;
        pointer-events: none; 
    }

    .game-menu-container {
        position: fixed;
        right: 20px;
        bottom: 550px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 1000;
        width: 170px;
    }

    .menu-label {
        color: #ffb6c1;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: -2px;
        text-align: right;
        opacity: 0.9;
        text-shadow: 0 0 5px rgba(255, 105, 180, 0.5);
    }

    .game-btn {
        position: relative;
        padding: 12px 15px;
        background: rgba(255, 20, 147, 0.15);
        border: 1px solid rgba(255, 105, 180, 0.5);
        backdrop-filter: blur(5px);
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: space-between;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .game-btn span {
        font-family: 'Orbitron', sans-serif;
        font-size: 12px;
        z-index: 2;
        text-shadow: 0 0 2px rgba(255, 20, 147, 0.5);
    }

    .game-btn:hover {
        background: rgba(255, 20, 147, 0.3);
        border-color: rgba(255, 105, 180, 1);
        box-shadow: 0 0 20px rgba(255, 20, 147, 0.6);
        transform: translateX(-5px);
    }

    .game-btn::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 0%; height: 100%;
        background: linear-gradient(90deg, rgba(255, 20, 147, 0.4), transparent);
        transition: width 0.3s;
        z-index: 1;
    }

    .game-btn:hover::before {
        width: 100%;
    }

    .menu-icon-block {
        width: 14px;
        height: 14px;
        background: linear-gradient(135deg, #ff69b4, #bd00ff);
        border-radius: 3px;
        box-shadow: 0 0 8px rgba(255, 105, 180, 0.8);
        z-index: 2;
        position: relative;
        border: 1px solid rgba(255,255,255,0.3);
    }

    #ui .love {
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -225px 0 0 -225px;
      --i: 1;
      pointer-events: none;
    }
    #ui .love:last-child .love_word {
      color: #fff;
      font-size: 2rem;
      text-shadow: 0 0 10px #ea80b0;
    }
    #ui .love:last-child .love_word {
        color: #ea80b0;
        font-size: 1.4rem;
        text-shadow: 0 0 10px #fff;
    }

    #ui .love_word {
      color: #ea80b0;
      font-size: 1.4rem;
      transform: translateY(-100%) rotateZ(-30deg);
      text-shadow: 0 0 10px #fff;
      letter-spacing: 2px;
      white-space: nowrap;
    }
    #ui .love_horizontal {
      animation: horizontal 10000ms infinite alternate ease-in-out;
      animation-delay: calc(var(--i) * -300ms);
    }
    #ui .love_vertical {
      animation: vertical 20000ms infinite linear;
      animation-delay: calc(var(--i) * -300ms);
    }

    @keyframes horizontal {
      from { transform: translateX(0px); }
      to   { transform: translateX(450px); }
    }
    @keyframes vertical {
      0%   { transform: translateY(180px); }
      10%  { transform: translateY(45px); }
      15%  { transform: translateY(4.5px); }
      18%  { transform: translateY(0px); }
      20%  { transform: translateY(4.5px); }
      22%  { transform: translateY(34.61538px); }
      24%  { transform: translateY(64.28571px); }
      25%  { transform: translateY(112.5px); }
      26%  { transform: translateY(64.28571px); }
      28%  { transform: translateY(34.61538px); }
      30%  { transform: translateY(4.5px); }
      32%  { transform: translateY(0px); }
      35%  { transform: translateY(4.5px); }
      40%  { transform: translateY(45px); }
      50%  { transform: translateY(180px); }
      71%  { transform: translateY(428.57143px); }
      72.5%{ transform: translateY(441.17647px); }
      75%  { transform: translateY(450px); }
      77.5%{ transform: translateY(441.17647px); }
      79%  { transform: translateY(428.57143px); }
      100% { transform: translateY(180px); }
    }

    @media screen and (max-width: 768px) {
        pre {
            font-size: 4px !important;
            line-height: 5px !important;
            left: -10% !important;
        }
        body {
            font-size: 10px !important;
        }
        
        .game-menu-container {
            bottom: 120px; 
            right: 20px;   
            width: 150px; 
            transform: none; 
            align-items: flex-end; 
        }
        
        .menu-label {
            display: block; 
            font-size: 9px;
        }
    }
  </style>
</head>
<body>

  <div class="landscape">
      <!-- Sun in Sky -->
      <div class="sun"></div>

      <!-- Background Hill -->
      <div class="hill-bg"></div>
      
      <!-- Festival flags -->
      <div class="flag" style="left: 10%; bottom: 24%; z-index: 2;"></div>
      <div class="flag" style="left: 85%; bottom: 22%; z-index: 2; transform: scale(0.9);"></div>

      <!-- Objects Container (Mixed depth) -->
      <div class="scene-objects">
        <div class="songkran-kids">
          <div class="kid girl">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
            <div class="gun"></div>
          </div>
          <div class="kid boy">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm"></div>
            <div class="leg left"></div>
            <div class="leg right"></div>
            <div class="gun"></div>
          </div>
          <div class="splash"></div>
        </div>
        
        <div class="flag" style="right: 15%; bottom: 8%; z-index: 2; height: 110px;"></div>
      </div>

      <!-- Foreground Hill -->
      <div class="hill-fg"></div>
  </div>

  <canvas id="water-canvas"></canvas>

  <div id="ui"></div>

  <div class="game-menu-container">
      <div class="menu-label">GAMES LIST</div>
      
      <a href="real-blck.html" class="game-btn">
          <span>REAL BLOCK</span>
          <div class="menu-icon-block"></div>
      </a>
  </div>

  <script>
    const N = 100; 
    const ui = document.getElementById('ui');

    for (let i = 1; i <= N; i++) {
      const love = document.createElement('div');
      love.className = 'love';
      love.style.setProperty('--i', i);

      const h = document.createElement('div');
      h.className = 'love_horizontal';

      const v = document.createElement('div');
      v.className = 'love_vertical';

      const word = document.createElement('div');
      word.className = 'love_word';
      word.textContent = 'Real love Preem';

      v.appendChild(word);
      h.appendChild(v);
      love.appendChild(h);
      ui.appendChild(love);
    }

    const canvas = document.getElementById('water-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let droplets = [];
    
    const WATER_COUNT = 360; 

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    class WaterDrop {
        constructor() {
            this.reset(true);
        }

        reset(initial = false) {
            this.x = Math.random() * width;
            this.y = initial ? Math.random() * height : -10;
            
            this.size = Math.random() * 3 + 1.5;
            
            this.speed = this.size * 0.8 + 1.2;
            
            this.swayOffset = Math.random() * Math.PI * 2;
            this.swayAmplitude = Math.random() * 0.8 + 0.4;

            this.opacity = Math.random() * 0.35 + 0.45;
        }

        update() {
            this.y += this.speed;
            this.x += Math.sin(this.y * 0.012 + this.swayOffset) * this.swayAmplitude;

            if (this.y > height) {
                this.reset();
            }
            if (this.x > width) {
                this.x = 0;
            } else if (this.x < 0) {
                this.x = width;
            }
        }

        draw() {
            const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
            gradient.addColorStop(0, `rgba(186, 230, 253, ${this.opacity + 0.2})`);
            gradient.addColorStop(1, `rgba(14, 165, 233, ${this.opacity})`);
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initWater() {
        droplets = [];
        for(let i=0; i<WATER_COUNT; i++) {
            droplets.push(new WaterDrop());
        }
    }

    function animateWater() {
        ctx.clearRect(0, 0, width, height);
        droplets.forEach(drop => {
            drop.update();
            drop.draw();
        });
        requestAnimationFrame(animateWater);
    }

    window.addEventListener('resize', () => {
        resize();
        initWater(); 
    });

    resize();
    initWater();
    animateWater();
  </script>
</body>
</html>
